<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
      <div class="glass-panel login-panel">
        <div class="logo">
          <div class="logo-icon">💬</div>
          <h1>Pro Chat</h1>
        </div>
        <p class="subtitle">Join the conversation</p>
        
        <form id="join-form">
          <div class="input-group">
            <label for="username">Display Name</label>
            <input type="text" id="username" placeholder="Enter your name" maxlength="32" required autocomplete="off">
          </div>
          
          <div class="input-group">
            <label for="room-select">Room</label>
            <div class="room-input-wrapper">
              <input type="text" id="room-input" placeholder="global" value="global" maxlength="50" autocomplete="off">
            </div>
            <div class="room-suggestions" id="room-list">
              <!-- Room chips will go here -->
            </div>
          </div>

          <button type="submit" class="btn-primary">
            <span>Join Chat</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </form>
      </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="screen">
      <div class="chat-layout">
        <!-- Sidebar (Desktop) -->
        <aside class="sidebar">
          <div class="sidebar-header">
            <div class="logo-small">💬</div>
            <h2>Pro Chat</h2>
          </div>
          
          <div class="sidebar-section">
            <h3>Current Room</h3>
            <div class="current-room-badge">
              <span class="status-dot"></span>
              <span id="current-room-name">global</span>
            </div>
          </div>

          <div class="sidebar-section">
            <h3>Online Users (<span id="user-count">0</span>)</h3>
            <ul id="users-list" class="users-list">
              <!-- Users will be added here -->
            </ul>
          </div>

          <div class="sidebar-footer">
            <button id="leave-btn" class="btn-secondary">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              Leave Room
            </button>
          </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
          <header class="chat-header">
            <button id="mobile-menu-btn" class="icon-btn mobile-only">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="header-info">
              <h2 id="header-room-name">#global</h2>
              <span class="connection-status" id="connection-status">Connecting...</span>
            </div>
          </header>

          <div id="messages-container" class="messages-container">
            <div class="welcome-message">
              <div class="welcome-icon">👋</div>
              <h3>Welcome to Pro Chat!</h3>
              <p>You've joined the <strong id="welcome-room-name">global</strong> room.</p>
            </div>
            <!-- Messages will be inserted here -->
          </div>

          <div class="typing-indicator" id="typing-indicator">
            <span>Someone is typing...</span>
          </div>

          <div class="chat-input-area">
            <form id="message-form">
              <div class="input-wrapper">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <label for="image-upload" class="icon-btn upload-btn" title="Upload Image">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                  <input type="file" id="image-upload" accept="image/*" hidden>
                </label>
              </div>
              <button type="submit" class="btn-send">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              </button>
            </form>
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- Mobile Sidebar Overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <script>
    // Client-side logic
    const socket = io({
      transports: ['polling', 'websocket'], // Prefer polling for Vercel stability
      reconnectionAttempts: 5
    });

    // DOM Elements
    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const joinForm = document.getElementById('join-form');
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');
    const messagesContainer = document.getElementById('messages-container');
    const roomInput = document.getElementById('room-input');
    const roomList = document.getElementById('room-list');
    const usersList = document.getElementById('users-list');
    const userCount = document.getElementById('user-count');
    const currentRoomName = document.getElementById('current-room-name');
    const headerRoomName = document.getElementById('header-room-name');
    const welcomeRoomName = document.getElementById('welcome-room-name');
    const connectionStatus = document.getElementById('connection-status');
    const leaveBtn = document.getElementById('leave-btn');
    const imageUpload = document.getElementById('image-upload');
    const typingIndicator = document.getElementById('typing-indicator');
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const sidebar = document.querySelector('.sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');

    let myName = '';
    let currentRoom = '';
    let typingTimeout = null;

    // Join Room
    joinForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('username').value.trim();
      const room = roomInput.value.trim() || 'global';
      
      if (name) {
        myName = name;
        currentRoom = room;
        socket.emit('join', { name, roomId: room });
        
        loginScreen.classList.remove('active');
        chatScreen.classList.add('active');
        
        // Update UI
        currentRoomName.textContent = room;
        headerRoomName.textContent = '#' + room;
        welcomeRoomName.textContent = room;
        
        // Clear previous messages if re-joining
        const welcomeMsg = messagesContainer.querySelector('.welcome-message');
        messagesContainer.innerHTML = '';
        if(welcomeMsg) messagesContainer.appendChild(welcomeMsg);
      }
    });

    // Send Message
    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      
      if (text) {
        socket.emit('message', { text });
        messageInput.value = '';
        socket.emit('typing', false);
      }
    });

    // Image Upload
    imageUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        if (file.size > 5 * 1024 * 1024) {
          alert('Image too large (max 5MB)');
          return;
        }
        
        const reader = new FileReader();
        reader.onload = (evt) => {
          socket.emit('message', { image: evt.target.result });
        };
        reader.readAsDataURL(file);
        e.target.value = ''; // reset
      }
    });

    // Typing Indicator
    messageInput.addEventListener('input', () => {
      socket.emit('typing', true);
      
      if (typingTimeout) clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('typing', false);
      }, 2000);
    });

    // Leave Room
    leaveBtn.addEventListener('click', () => {
      location.reload();
    });

    // Mobile Menu
    mobileMenuBtn.addEventListener('click', () => {
      sidebar.classList.add('active');
      sidebarOverlay.classList.add('active');
    });

    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('active');
      sidebarOverlay.classList.remove('active');
    });

    // Socket Events
    socket.on('connect', () => {
      connectionStatus.textContent = 'Connected';
      connectionStatus.style.color = '#10b981';
    });

    socket.on('disconnect', () => {
      connectionStatus.textContent = 'Disconnected';
      connectionStatus.style.color = '#ef4444';
    });

    socket.on('message', (msg) => {
      addMessage(msg);
    });

    socket.on('history', (msgs) => {
      msgs.forEach(addMessage);
    });

    socket.on('system', (msg) => {
      addSystemMessage(msg);
    });

    socket.on('presence:update', (users) => {
      updateUserList(users);
    });

    socket.on('rooms:list', (rooms) => {
      updateRoomList(rooms);
    });

    socket.on('typing', ({ name, isTyping }) => {
      if (isTyping) {
        typingIndicator.querySelector('span').textContent = `${name} is typing...`;
        typingIndicator.classList.add('active');
      } else {
        typingIndicator.classList.remove('active');
      }
    });

    // UI Helpers
    function addMessage(msg) {
      const isMe = msg.user.name === myName;
      const div = document.createElement('div');
      div.className = `message ${isMe ? 'message-own' : ''}`;
      
      const time = new Date(msg.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      let contentHtml = '';
      if (msg.text) {
        contentHtml += `<p>${escapeHtml(msg.text)}</p>`;
      }
      if (msg.image) {
        contentHtml += `<img src="${msg.image}" alt="Shared image" loading="lazy">`;
      }

      div.innerHTML = `
        <div class="message-content">
          ${!isMe ? `<div class="message-author">${escapeHtml(msg.user.name)}</div>` : ''}
          <div class="message-bubble">
            ${contentHtml}
          </div>
          <div class="message-time">${time}</div>
        </div>
      `;
      
      messagesContainer.appendChild(div);
      scrollToBottom();
    }

    function addSystemMessage(msg) {
      const div = document.createElement('div');
      div.className = 'system-message';
      div.innerHTML = `<span>${escapeHtml(msg.text)}</span>`;
      messagesContainer.appendChild(div);
      scrollToBottom();
    }

    function updateUserList(users) {
      userCount.textContent = users.length;
      usersList.innerHTML = users.map(u => `
        <li>
          <div class="user-avatar">${u.name.charAt(0).toUpperCase()}</div>
          <span>${escapeHtml(u.name)}</span>
          ${u.name === myName ? '<span class="you-badge">(You)</span>' : ''}
        </li>
      `).join('');
    }

    function updateRoomList(rooms) {
      // Filter out current room and limit
      const otherRooms = rooms.filter(r => r !== 'global').slice(0, 5);
      
      if (otherRooms.length > 0) {
        roomList.innerHTML = otherRooms.map(r => `
          <button type="button" class="room-chip" onclick="selectRoom('${r}')">#${r}</button>
        `).join('');
      } else {
        roomList.innerHTML = '';
      }
    }

    window.selectRoom = (room) => {
      roomInput.value = room;
    };

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
