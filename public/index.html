<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sai Chat - Professional Real-Time Chat</title>
    <meta name="description" content="Professional real-time chat application with rooms, sharing, and instant messaging">
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="brand">
                <div class="brand-icon"></div>
                <div class="brand-name">Sai Chat</div>
                <div style="font-size:10px; color:#64748b; font-weight:400; margin-top:2px; letter-spacing:0.5px;">PRO</div>
            </div>
            <div class="group">
                <div class="group-head">
                    <span>Rooms</span>
                    <button class="add-room-btn" id="addRoomBtn" title="Create new room">+</button>
                </div>
                <div class="room-list" id="rooms"></div>
                <div class="create-room" id="createRoom" style="display:none;">
                    <input type="text" id="newRoomInput" placeholder="Room name..." class="new-room-input">
                    <div class="room-actions">
                        <button class="room-action-btn" id="createRoomBtn">Create</button>
                        <button class="room-action-btn cancel" id="cancelRoomBtn">Cancel</button>
                    </div>
                </div>
            </div>
            <hr>
            <div class="group">
                <div class="group-head">
                    <span>Online (<span id="onlineCount">0</span>)</span>
                </div>
                <div class="user-list" id="users"></div>
            </div>
        </div>
        <div class="main">
            <div class="chat-head">
                <h1 id="roomTitle"># global</h1>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button class="share-btn" id="shareBtn" title="Share chat">
                        <span>🔗</span> Share
                    </button>
                    <button class="gear" title="Settings">⚙️</button>
                </div>
            </div>
            
            <!-- Share Modal -->
            <div class="modal" id="shareModal" style="display:none;">
                <div class="panel">
                    <h2>Share Sai Chat</h2>
                    <p class="subtle">Invite your friends to join the chat!</p>
                    
                    <div class="share-options">
                        <div class="share-input-group">
                            <input type="text" id="shareUrlInput" readonly class="share-url-input">
                            <button class="copy-btn" id="copyUrlBtn">Copy</button>
                        </div>
                        
                        <div class="social-share">
                            <p style="margin:16px 0 8px; color:#aab2c8; font-size:13px;">Share on:</p>
                            <div class="social-buttons">
                                <button class="social-btn whatsapp" onclick="shareOnWhatsApp()" title="Share on WhatsApp">
                                    <span>💬</span> WhatsApp
                                </button>
                                <button class="social-btn facebook" onclick="shareOnFacebook()" title="Share on Facebook">
                                    <span>📘</span> Facebook
                                </button>
                                <button class="social-btn twitter" onclick="shareOnTwitter()" title="Share on Twitter">
                                    <span>🐦</span> Twitter
                                </button>
                                <button class="social-btn email" onclick="shareViaEmail()" title="Share via Email">
                                    <span>📧</span> Email
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="modal-actions">
                        <button class="modal-btn" onclick="closeShareModal()">Close</button>
                    </div>
                </div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="typing" id="typing"></div>
            <div class="composer">
                <input type="file" id="fileInput" accept="image/*" style="display:none;" multiple>
                <button class="icon-btn" id="attachBtn" title="Attach image">📎</button>
                <input type="text" class="input" id="input" placeholder="Type a message...">
                <button class="send" id="send">Send</button>
            </div>
            
            <!-- Image Preview Modal -->
            <div class="modal" id="imagePreviewModal" style="display:none;">
                <div class="panel" style="max-width:600px;">
                    <h2>Image Preview</h2>
                    <div id="imagePreviewContainer" style="margin:20px 0; text-align:center;"></div>
                    <div class="modal-actions">
                        <button class="modal-btn" onclick="closeImagePreview()">Cancel</button>
                        <button class="modal-btn" style="background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; border:0;" onclick="sendImageMessage()">Send Image</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
// Connect to socket.io - use current host in production
// Force HTTPS in production if available
const socketUrl = window.location.origin;
const socket = io(socketUrl, {
    transports: ['websocket', 'polling'],
    reconnection: true,
    reconnectionDelay: 1000,
    reconnectionAttempts: 5,
    secure: window.location.protocol === 'https:',
    rejectUnauthorized: false
});

socket.on('connect', () => {
    console.log('Socket connected successfully');
});

socket.on('connect_error', (error) => {
    console.error('Socket connection error:', error);
    alert('Failed to connect to chat server. Please refresh the page.');
});

socket.on('disconnect', () => {
    console.log('Socket disconnected');
});

const $users = document.getElementById('users');
const $onlineCount = document.getElementById('onlineCount');
const $rooms = document.getElementById('rooms');
const $roomTitle = document.getElementById('roomTitle');
const $messages = document.getElementById('messages');
const $input = document.getElementById('input');
const $send = document.getElementById('send');
const $typing = document.getElementById('typing');

const state = {
    users: [],
    room: 'global',
    name: '',
    typingBy: new Set(),
    allRooms: [],
    pendingImage: null
};

function addMessage(msg) {
    const el = document.createElement('div');
    el.className = 'msg ' + (msg.user.name === state.name ? 'me' : 'other');
    const time = new Date(msg.ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    
    let content = '';
    if (msg.image) {
        // Escape the image src for security
        const imageSrc = escapeHtml(msg.image);
        content = `<div class="msg-image-container">
            <img src="${imageSrc}" alt="Shared image" class="msg-image" onclick="openImageModal('${imageSrc.replace(/'/g, "\\'")}')">
        </div>`;
    }
    if (msg.text) {
        content += `<div class="msg-text">${escapeHtml(msg.text)}</div>`;
    }
    
    el.innerHTML = `
        <div class="msg-meta">
            <span class="name">${escapeHtml(msg.user.name)}</span>
            <span class="time">${time}</span>
        </div>
        ${content}
    `;
    $messages.appendChild(el);
    autoscroll();
}

// Image modal for full view (make it global)
window.openImageModal = function(imageSrc) {
    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.style.display = 'flex';
    modal.style.zIndex = '2000';
    const escapedSrc = escapeHtml(imageSrc);
    modal.innerHTML = `
        <div class="panel" style="max-width:90vw; max-height:90vh; padding:20px; background:rgba(15,23,42,.95); border:1px solid rgba(255,255,255,.1);">
            <img src="${escapedSrc}" style="max-width:100%; max-height:80vh; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.5); cursor:pointer;" onclick="this.closest('.modal').remove()">
            <button class="modal-btn" style="margin-top:16px; background:rgba(0,0,0,.7); color:#fff; width:100%;" onclick="this.closest('.modal').remove()">Close</button>
        </div>
    `;
    document.body.appendChild(modal);
    modal.onclick = (e) => {
        if (e.target === modal) modal.remove();
    };
};

function autoscroll(){
    $messages.scrollTop = $messages.scrollHeight;
}

function setUsers(list){
    state.users = list;
    $users.innerHTML = '';
    list.forEach(u => {
        const el = document.createElement('div');
        el.className = 'user';
        el.innerHTML = `<span class="dot"></span><span>${escapeHtml(u.name)}</span>`;
        $users.appendChild(el);
    });
    $onlineCount.textContent = list.length;
}

function renderRooms(){
    $rooms.innerHTML = '';
    // Use the list of rooms from server, ensuring global and current room are included
    const roomIds = [...new Set(['global', ...state.allRooms, state.room])].sort();
    
    // Put global first
    const sortedRooms = [];
    if (roomIds.includes('global')) {
        sortedRooms.push('global');
        roomIds.forEach(r => {
            if (r !== 'global') sortedRooms.push(r);
        });
    } else {
        sortedRooms.push(...roomIds);
    }
    
    sortedRooms.forEach(r => {
        const a = document.createElement('button');
        a.className = 'room' + (r === state.room ? ' active' : '');
        a.textContent = `# ${r}`;
        a.onclick = () => {
            joinRoom(r);
        };
        $rooms.appendChild(a);
    });
}

function joinRoom(roomId) {
    if (!socket.connected) {
        console.log('Socket not connected, waiting...');
        // Wait for connection
        socket.once('connect', () => {
            console.log('Socket connected, joining room');
            joinRoom(roomId);
        });
        return;
    }
    
    if (!roomId) {
        roomId = 'global';
    }
    
    // Sanitize room ID (same as server)
    const sanitized = roomId.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '').slice(0, 50) || 'global';
    
    console.log('Joining room:', sanitized, 'from input:', roomId);
    
    state.room = sanitized;
    
    // Emit join event
    socket.emit('join', { roomId: sanitized, name: state.name });
    
    // Update UI
    $roomTitle.textContent = `# ${sanitized}`;
    [...$rooms.children].forEach(ch => ch.classList.remove('active'));
    
    // Update active room button after rooms are rendered
    setTimeout(() => {
        const activeBtn = Array.from($rooms.children).find(ch => ch.textContent === `# ${sanitized}`);
        if (activeBtn) activeBtn.classList.add('active');
    }, 100);
    
    $messages.innerHTML = '';
    
    // Update URL without page reload - always include room for sharing
    const url = new URL(window.location);
    url.searchParams.set('room', sanitized);
    window.history.pushState({ room: sanitized }, '', url);
    
    console.log('Updated URL to:', url.toString());
}

let typingTimer;
$input.addEventListener('input', () => {
    clearTimeout(typingTimer);
    socket.emit('typing', true);
    typingTimer = setTimeout(() => socket.emit('typing', false), 900);
});

$input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        $send.onclick();
    }
});

// File upload handling
const $fileInput = document.getElementById('fileInput');
const $attachBtn = document.getElementById('attachBtn');
const $imagePreviewModal = document.getElementById('imagePreviewModal');
const $imagePreviewContainer = document.getElementById('imagePreviewContainer');

$attachBtn.onclick = () => {
    $fileInput.click();
};

$fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    // Check if it's an image
    if (!file.type.startsWith('image/')) {
        alert('Please select an image file');
        return;
    }
    
    // Check file size (max 5MB)
    if (file.size > 5 * 1024 * 1024) {
        alert('Image size must be less than 5MB');
        return;
    }
    
    // Read image as base64
    const reader = new FileReader();
    reader.onload = (event) => {
        state.pendingImage = event.target.result;
        showImagePreview(event.target.result);
    };
    reader.readAsDataURL(file);
});

function showImagePreview(imageSrc) {
    $imagePreviewContainer.innerHTML = `
        <img src="${imageSrc}" style="max-width:100%; max-height:400px; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.2);">
        <p style="margin-top:12px; color:#94a3b8; font-size:13px;">Preview your image before sending</p>
    `;
    $imagePreviewModal.style.display = 'flex';
}

window.closeImagePreview = function() {
    $imagePreviewModal.style.display = 'none';
    state.pendingImage = null;
    $fileInput.value = '';
};

window.sendImageMessage = function() {
    if (!state.pendingImage) return;
    
    const text = ($input.value || '').trim();
    socket.emit('message', { 
        text: text || '📷 Image',
        image: state.pendingImage 
    });
    
    $input.value = '';
    state.pendingImage = null;
    $fileInput.value = '';
    closeImagePreview();
    socket.emit('typing', false);
};

// Close image preview modal when clicking outside
$imagePreviewModal.onclick = (e) => {
    if (e.target === $imagePreviewModal) {
        closeImagePreview();
    }
};

$send.onclick = () => {
    // If there's a pending image, send it
    if (state.pendingImage) {
        sendImageMessage();
        return;
    }
    
    const text = ($input.value || '').trim();
    if (!text) return;
    socket.emit('message', { text });
    $input.value='';
    socket.emit('typing', false);
};

// Socket events
socket.on('history', (msgs) => {
    $messages.innerHTML = '';
    msgs.forEach(addMessage);
    autoscroll();
});

socket.on('message', addMessage);
socket.on('system', addMessage);
socket.on('presence:update', setUsers);

socket.on('typing', ({ name, isTyping }) => {
    if (isTyping) state.typingBy.add(name); else state.typingBy.delete(name);
    const others = [...state.typingBy].filter(n => n !== state.name);
    $typing.textContent = others.length ? `${others.join(', ')} typing…` : '';
});

socket.on('rooms:list', (roomList) => {
    // Ensure global is always in the list
    if (!roomList.includes('global')) {
        roomList.push('global');
    }
    state.allRooms = roomList;
    renderRooms();
    
    // If we haven't initialized yet and socket is connected, try to initialize
    if (!initialized && socket.connected && nameEntered) {
        setTimeout(() => {
            if (!initialized) {
                initializeApp();
            }
        }, 100);
    }
});

function escapeHtml(str){
    return String(str).replace(/[&<>\"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[s]));
}

// Room creation UI
const $addRoomBtn = document.getElementById('addRoomBtn');
const $createRoom = document.getElementById('createRoom');
const $newRoomInput = document.getElementById('newRoomInput');
const $createRoomBtn = document.getElementById('createRoomBtn');
const $cancelRoomBtn = document.getElementById('cancelRoomBtn');
const $shareBtn = document.getElementById('shareBtn');

$addRoomBtn.onclick = () => {
    $createRoom.style.display = $createRoom.style.display === 'none' ? 'block' : 'none';
    if ($createRoom.style.display === 'block') {
        $newRoomInput.focus();
    }
};

$createRoomBtn.onclick = () => {
    const roomName = ($newRoomInput.value || '').trim();
    if (roomName) {
        socket.emit('room:create', { roomId: roomName });
        $newRoomInput.value = '';
        $createRoom.style.display = 'none';
    }
};

$cancelRoomBtn.onclick = () => {
    $newRoomInput.value = '';
    $createRoom.style.display = 'none';
};

$newRoomInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        $createRoomBtn.onclick();
    } else if (e.key === 'Escape') {
        $cancelRoomBtn.onclick();
    }
});

// Share functionality
const $shareModal = document.getElementById('shareModal');
const $shareUrlInput = document.getElementById('shareUrlInput');
const $copyUrlBtn = document.getElementById('copyUrlBtn');

function getShareUrl() {
    // Get the current origin (works for both localhost and production)
    const origin = window.location.origin;
    const pathname = window.location.pathname || '/';
    
    // Create clean URL
    const url = new URL(origin + pathname);
    
    // Always include room parameter for clarity (even if global)
    if (state.room) {
        url.searchParams.set('room', state.room);
    }
    
    const shareUrl = url.toString();
    console.log('Generated share URL:', shareUrl);
    return shareUrl;
}

function openShareModal() {
    const shareUrl = getShareUrl();
    $shareUrlInput.value = shareUrl;
    $shareModal.style.display = 'flex';
}

function closeShareModal() {
    $shareModal.style.display = 'none';
}

// Close modal when clicking outside
$shareModal.onclick = (e) => {
    if (e.target === $shareModal) {
        closeShareModal();
    }
};

// Copy URL button
$copyUrlBtn.onclick = () => {
    const shareUrl = getShareUrl();
    console.log('Copying URL:', shareUrl);
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
            $copyUrlBtn.textContent = '✓ Copied!';
            // Show success message
            const originalText = $copyUrlBtn.textContent;
            setTimeout(() => {
                $copyUrlBtn.textContent = 'Copy';
            }, 2000);
            // Also show alert for confirmation
            alert('Link copied to clipboard!\n\n' + shareUrl);
        }).catch((err) => {
            console.error('Clipboard error:', err);
            copyToClipboardFallback(shareUrl);
        });
    } else {
        copyToClipboardFallback(shareUrl);
    }
};

// Share button opens modal
$shareBtn.onclick = openShareModal;

// Social sharing functions
function shareOnWhatsApp() {
    const url = getShareUrl();
    const text = `Join me on Sai Chat! ${url}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
}

function shareOnFacebook() {
    const url = encodeURIComponent(getShareUrl());
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
}

function shareOnTwitter() {
    const url = encodeURIComponent(getShareUrl());
    const text = encodeURIComponent('Join me on Sai Chat!');
    window.open(`https://twitter.com/intent/tweet?url=${url}&text=${text}`, '_blank');
}

function shareViaEmail() {
    const url = getShareUrl();
    const subject = encodeURIComponent('Join me on Sai Chat!');
    const body = encodeURIComponent(`Hey! Join me on Sai Chat:\n\n${url}`);
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

function copyToClipboardFallback(link) {
    const textArea = document.createElement('textarea');
    textArea.value = link;
    textArea.style.position = 'fixed';
    textArea.style.left = '-9999px';
    textArea.style.top = '0';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
        document.execCommand('copy');
        const originalText = $shareBtn.textContent;
        $shareBtn.textContent = '✓';
        setTimeout(() => {
            $shareBtn.textContent = originalText;
        }, 2000);
    } catch (err) {
        // Last resort - show prompt
        prompt('Copy this link:', link);
    }
    document.body.removeChild(textArea);
}

// Check URL for room parameter on load
function getRoomFromURL() {
    const params = new URLSearchParams(window.location.search);
    let room = params.get('room');
    
    // Also check hash if search params don't have it
    if (!room && window.location.hash) {
        const hashMatch = window.location.hash.match(/room=([^&]+)/);
        if (hashMatch) {
            room = hashMatch[1];
        }
    }
    
    console.log('Room from URL:', room);
    return room || 'global';
}

// Handle browser back/forward buttons
window.addEventListener('popstate', (e) => {
    const roomFromURL = getRoomFromURL();
    if (roomFromURL !== state.room) {
        joinRoom(roomFromURL);
    }
});

// Initialize: prompt for name and join room from URL
let initialized = false;
let nameEntered = false;

function initializeApp() {
    if (initialized) return;
    
    // Get name first (only once)
    if (!nameEntered) {
        const name = prompt('Enter your name:') || `user-${Math.random().toString(36).substr(2, 9)}`;
        state.name = name.trim().slice(0, 32);
        nameEntered = true;
    }
    
    // Function to actually join the room
    function doJoinRoom() {
        if (initialized) return; // Prevent double initialization
        initialized = true;
        
        const initialRoom = getRoomFromURL();
        console.log('Initializing app, joining room from URL:', initialRoom);
        console.log('Current URL:', window.location.href);
        
        // Ensure we have a valid room
        if (!initialRoom || initialRoom === 'undefined' || initialRoom === 'null') {
            console.log('Invalid room from URL, using global');
            joinRoom('global');
        } else {
            joinRoom(initialRoom);
        }
    }
    
    // Wait for socket connection
    if (socket && socket.connected) {
        // Socket already connected, wait a bit for rooms list
        setTimeout(doJoinRoom, 300);
    } else if (socket) {
        socket.once('connect', () => {
            console.log('Socket connected, waiting for rooms list...');
            // Wait for rooms list to be received
            socket.once('rooms:list', () => {
                setTimeout(doJoinRoom, 100);
            });
            // Fallback in case rooms:list was already received
            setTimeout(doJoinRoom, 500);
        });
    } else {
        // Socket not initialized yet, wait a bit
        setTimeout(() => {
            if (socket && socket.connected) {
                doJoinRoom();
            } else if (socket) {
                socket.once('connect', doJoinRoom);
            }
        }, 1000);
    }
}

// Initialize when page loads
if (document.readyState === 'loading') {
    window.addEventListener('load', () => {
        setTimeout(initializeApp, 100);
    });
} else {
    // Page already loaded
    setTimeout(initializeApp, 100);
}

// Init default rooms
renderRooms();
    </script>
</body>
</html>
